name: DevSecOps CI & Security Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssdlc-gate:
    name: Secret Scan, SCA, SBOM & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Deterministic Lockfile Install
        run: npm ci --ignore-scripts

      - name: SCA Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Verify Production Bundle & Sourcemap Hardening
        run: |
          npm run build
          if find dist -name "*.map" | grep -q .; then
            echo "Security Gate Failed: Production source maps (.map) detected in dist/"
            exit 1
          fi
